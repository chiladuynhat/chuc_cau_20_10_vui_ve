<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Món Quà Nhỏ Ngày 20/10 🌷</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --rose-deep: #8c0f2e;
      --rose-primary: #c9184a;
      --rose-bright: #e03160;
      --peach-pink: #ff758f;
      --pastel-pink: #ffb3c1;
      --soft-blush: #ffe5ec;
      --cream-bg: #fff9f6;
      --cream-card: #fffcf7;
      --gold-primary: #d4af37;
      --gold-light: #f3d999;
      --gold-dark: #9e7818;
      --wine-text: #461220;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font-sans);
      color: var(--wine-text);
      background: #1a060d;
      user-select: none;
    }

    /* Main Scene & Romantic Background */
    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 42%, rgba(255, 243, 245, 0.96) 0%, rgba(255, 216, 226, 0.88) 36%, rgba(238, 150, 174, 0.78) 68%, rgba(148, 28, 62, 0.88) 100%),
        linear-gradient(135deg, #fff6f8 0%, #ffd4df 50%, #df6888 100%);
      transition: background 2s cubic-bezier(0.22, 1, 0.36, 1);
      perspective: 1800px;
    }

    .scene.state-finale {
      background:
        radial-gradient(circle at 50% 48%, rgba(255, 248, 249, 0.98) 0%, rgba(255, 218, 228, 0.92) 38%, rgba(230, 128, 158, 0.84) 72%, rgba(125, 18, 50, 0.92) 100%),
        linear-gradient(135deg, #fff8f9 0%, #ffcad7 50%, #d45276 100%);
    }

    /* Top-Right Back Button */
    .btn-top-right-back {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 60;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8.5px 16px;
      border-radius: 999px;
      background: rgba(255, 250, 248, 0.86);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid rgba(212, 175, 55, 0.65);
      color: var(--rose-deep);
      font-family: var(--font-sans);
      font-size: 0.84rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(140, 15, 46, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-12px) scale(0.92);
      pointer-events: none;
      transition: all 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .btn-top-right-back.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .btn-top-right-back:hover {
      background: #fff0f4;
      border-color: var(--rose-primary);
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 10px 24px rgba(201, 24, 74, 0.25);
    }

    .btn-top-right-back:active {
      transform: translateY(0) scale(0.97);
    }

    .btn-top-right-back svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
      transition: transform 0.35s ease;
    }

    .btn-top-right-back:hover svg {
      transform: rotate(-35deg);
    }

    /* Soft Glowing Aura */
    .ambient-aura {
      position: absolute;
      top: 48%;
      left: 50%;
      width: min(680px, 92vw);
      height: min(680px, 92vw);
      transform: translate(-50%, -50%);
      background: radial-gradient(
        circle,
        rgba(255, 250, 238, 0.92) 0%,
        rgba(255, 192, 208, 0.65) 36%,
        rgba(255, 120, 152, 0.22) 64%,
        rgba(255, 120, 152, 0) 78%
      );
      filter: blur(24px);
      pointer-events: none;
      z-index: 1;
      animation: auraPulse 5.5s ease-in-out infinite alternate;
      transition: all 1.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .scene.state-FinaleGlow .ambient-aura {
      top: 50%;
      transform: translate(-50%, -50%) scale(1.25);
      background: radial-gradient(
        circle,
        rgba(255, 246, 220, 0.96) 0%,
        rgba(255, 175, 198, 0.78) 40%,
        rgba(218, 42, 90, 0.32) 68%,
        rgba(218, 42, 90, 0) 80%
      );
    }

    @keyframes auraPulse {
      0% { opacity: 0.78; transform: translate(-50%, -50%) scale(0.92); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
    }

    /* Particle Layers */
    .layer-fx {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    #bgParticlesLayer { z-index: 2; }
    #heartsLayer { z-index: 4; }
    #fgPetalsLayer { z-index: 15; }

    /* Center Stage Container */
    .stage-container {
      position: relative;
      z-index: 6;
      width: 100%;
      max-width: 560px;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Lock Screen Header & Password Panel */
    .lock-screen-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      z-index: 9;
      transition:
        opacity 1s cubic-bezier(0.4, 0, 0.2, 1),
        transform 1s cubic-bezier(0.4, 0, 0.2, 1),
        visibility 1s;
    }

    .scene.state-card-open .lock-screen-box,
    .scene.state-finale .lock-screen-box {
      opacity: 0;
      transform: translateY(-24px) scale(0.95);
      pointer-events: none;
      visibility: hidden;
    }

    .lock-emblem {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: radial-gradient(circle, #fffdf9 0%, #ffe3ec 100%);
      border: 1.5px solid rgba(212, 175, 55, 0.65);
      box-shadow: 0 10px 28px rgba(180, 20, 60, 0.16), 0 0 18px rgba(255, 255, 255, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.9rem;
      margin-bottom: 18px;
      animation: emblemFloat 3.2s ease-in-out infinite alternate;
    }

    @keyframes emblemFloat {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-8px) scale(1.05); }
    }

    .intro-header {
      text-align: center;
      margin-bottom: 18px;
    }

    .intro-title {
      font-family: var(--font-serif);
      font-size: clamp(1.85rem, 5vw, 2.65rem);
      font-weight: 700;
      color: var(--rose-deep);
      letter-spacing: 0.01em;
      line-height: 1.25;
      text-shadow: 0 2px 18px rgba(255, 255, 255, 0.95), 0 4px 24px rgba(201, 24, 74, 0.18);
    }

    .password-panel {
      width: 100%;
      max-width: 390px;
      padding: 24px 26px 24px;
      border-radius: 24px;
      background: rgba(255, 252, 249, 0.82);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow:
        0 18px 45px rgba(150, 18, 52, 0.15),
        0 2px 12px rgba(212, 175, 55, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
      text-align: center;
    }

    .password-guide {
      font-size: 0.96rem;
      font-weight: 500;
      color: var(--wine-text);
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .input-group {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .password-input {
      width: 100%;
      padding: 13.5px 18px;
      font-family: var(--font-sans);
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-align: center;
      color: var(--rose-deep);
      background: rgba(255, 255, 255, 0.94);
      border: 1.5px solid rgba(212, 175, 55, 0.48);
      border-radius: 14px;
      outline: none;
      transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: inset 0 2px 5px rgba(158, 20, 53, 0.04);
    }

    .password-input::placeholder {
      letter-spacing: 0.03em;
      font-weight: 400;
      font-size: 0.92rem;
      color: #b58392;
    }

    .password-input:focus {
      border-color: var(--rose-primary);
      background: #ffffff;
      box-shadow:
        0 0 0 4px rgba(255, 117, 143, 0.25),
        0 0 24px rgba(212, 175, 55, 0.38),
        inset 0 1px 3px rgba(0, 0, 0, 0.02);
      transform: translateY(-1px);
    }

    .btn-open-gift {
      position: relative;
      overflow: hidden;
      width: 100%;
      padding: 14px 22px;
      border: none;
      border-radius: 14px;
      font-family: var(--font-sans);
      font-size: 0.98rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: #fffdf9;
      background: linear-gradient(135deg, #d92658 0%, #b5123e 52%, #900b2f 100%);
      box-shadow:
        0 8px 22px rgba(181, 18, 62, 0.34),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.3s ease, filter 0.3s ease;
    }

    .btn-open-gift::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 65%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 240, 200, 0.38), transparent);
      transform: skewX(-22deg);
      transition: left 0.65s ease;
    }

    .btn-open-gift:hover {
      transform: translateY(-2px);
      box-shadow:
        0 12px 28px rgba(181, 18, 62, 0.45),
        0 0 16px rgba(212, 175, 55, 0.35);
      filter: brightness(1.05);
    }

    .btn-open-gift:hover::before {
      left: 135%;
    }

    .btn-open-gift:active {
      transform: translateY(0);
    }

    .error-msg {
      min-height: 20px;
      margin-top: 9px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #c9184a;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .error-msg.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .shake-anim {
      animation: gentleShake 0.48s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes gentleShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(7px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(4px); }
    }

    /* =======================================================
       REALISTIC BOUQUET STAGE & DYNAMIC FINALE ANIMATIONS
       ======================================================= */
    .bouquet-stage {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(440px, 88vw);
      height: min(470px, 64vh);
      transform: translate(-50%, -50%) scale(0.42);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 7;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition:
        opacity 0.85s ease,
        transform 1.1s cubic-bezier(0.22, 1, 0.36, 1),
        visibility 0.85s;
      will-change: transform, opacity;
    }

    /* Bouquet blooms into view in Finale */
    .scene.state-finale .bouquet-stage {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
      cursor: pointer;
      animation: bouquetBloomFinale 2.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes bouquetBloomFinale {
      0% {
        opacity: 0;
        transform: translate(-50%, -42%) scale(0.42);
        filter: brightness(1.18) blur(4px);
      }
      60% {
        opacity: 1;
        transform: translate(-50%, -52%) scale(1.08);
        filter: brightness(1.06) blur(0px) drop-shadow(0 24px 52px rgba(212, 175, 55, 0.42));
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
        filter: brightness(1) blur(0px) drop-shadow(0 20px 44px rgba(135, 16, 48, 0.32));
      }
    }

    /* Magical Rotating Sunbeams & Expanding Aura Rings Behind Bouquet */
    .bouquet-WaitGlow {
      position: absolute;
      top: 46%;
      left: 50%;
      width: 380px;
      height: 380px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: -1;
    }

    .sunbeam-halo {
      position: absolute;
      inset: -35px;
      border-radius: 50%;
      background: repeating-conic-gradient(
        from 0deg,
        rgba(255, 245, 210, 0.26) 0deg 15deg,
        rgba(255, 182, 198, 0.05) 15deg 30deg
      );
      filter: blur(12px);
      mask-image: radial-gradient(circle, rgba(0,0,0,1) 15%, rgba(0,0,0,0) 70%);
      -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 15%, rgba(0,0,0,0) 70%);
      animation: rotateSunbeams 24s linear infinite;
    }

    @keyframes rotateSunbeams {
      0% { transform: rotate(0deg) scale(0.96); }
      50% { transform: rotate(180deg) scale(1.08); }
      100% { transform: rotate(360deg) scale(0.96); }
    }

    .pulse-ring {
      position: absolute;
      inset: 20px;
      border-radius: 50%;
      border: 2px solid rgba(255, 232, 175, 0.55);
      box-shadow: 0 0 25px rgba(255, 143, 168, 0.45);
      opacity: 0;
      animation: ringExpand 4.2s cubic-bezier(0.21, 0.53, 0.56, 0.8) infinite;
    }
    .pulse-ring.r2 {
      animation-delay: 2.1s;
      border-color: rgba(255, 182, 202, 0.6);
    }

    @keyframes ringExpand {
      0% { transform: scale(0.55); opacity: 0; }
      25% { opacity: 0.75; }
      100% { transform: scale(1.42); opacity: 0; }
    }

    /* Continuous Floating + Breathing Layer */
    .bouquet-float-layer {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: bouquetFloatUpDown 3.6s ease-in-out infinite alternate;
      will-change: transform;
    }

    @keyframes bouquetFloatUpDown {
      0% { transform: translateY(10px) scale(0.98); }
      100% { transform: translateY(-14px) scale(1.035); }
    }

    /* Continuous Wind Swaying Wrapper */
    .bouquet-sway-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: 50% 88%;
      animation: gentleSway 4.4s ease-in-out infinite alternate;
      will-change: transform;
    }

    @keyframes gentleSway {
      0% { transform: rotate(-3.4deg); }
      50% { transform: rotate(0.8deg); }
      100% { transform: rotate(3.4deg); }
    }

    .bouquet-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Micro-Animations Inside the Bouquet SVG (Roses, Leaves, Ribbon) */
    .anim-foliage-left {
      transform-box: fill-box;
      transform-origin: 80% 90%;
      animation: foliageBreezeLeft 3.2s ease-in-out infinite alternate;
    }
    .anim-foliage-right {
      transform-box: fill-box;
      transform-origin: 20% 90%;
      animation: foliageBreezeRight 3.5s ease-in-out 0.4s infinite alternate;
    }
    .anim-foliage-top {
      transform-box: fill-box;
      transform-origin: 50% 95%;
      animation: foliageBreezeTop 2.9s ease-in-out 0.8s infinite alternate;
    }

    @keyframes foliageBreezeLeft {
      0% { transform: rotate(-4.5deg) scale(0.98); }
      100% { transform: rotate(4.5deg) scale(1.03); }
    }
    @keyframes foliageBreezeRight {
      0% { transform: rotate(4.5deg) scale(0.98); }
      100% { transform: rotate(-4.5deg) scale(1.03); }
    }
    @keyframes foliageBreezeTop {
      0% { transform: rotate(-3.5deg) translateY(2px); }
      100% { transform: rotate(3.5deg) translateY(-4px); }
    }

    .anim-rose-hero {
      transform-box: fill-box;
      transform-origin: center;
      animation: heroRosePulse 2.8s ease-in-out infinite alternate;
    }
    .anim-rose-group-a {
      transform-box: fill-box;
      transform-origin: center;
      animation: roseClusterPulseA 3.4s ease-in-out 0.3s infinite alternate;
    }
    .anim-rose-group-b {
      transform-box: fill-box;
      transform-origin: center;
      animation: roseClusterPulseB 3.8s ease-in-out 0.9s infinite alternate;
    }

    @keyframes heroRosePulse {
      0% { transform: scale(1) rotate(-1.5deg); }
      100% { transform: scale(1.06) rotate(2deg); }
    }
    @keyframes roseClusterPulseA {
      0% { transform: translateY(2px) scale(0.99) rotate(-1.2deg); }
      100% { transform: translateY(-4px) scale(1.03) rotate(1.5deg); }
    }
    @keyframes roseClusterPulseB {
      0% { transform: translateY(-3px) scale(1.02) rotate(1.2deg); }
      100% { transform: translateY(3px) scale(0.98) rotate(-1.5deg); }
    }

    .anim-ribbon-left {
      transform-box: fill-box;
      transform-origin: 90% 10%;
      animation: ribbonWaveLeft 2.7s ease-in-out infinite alternate;
    }
    .anim-ribbon-right {
      transform-box: fill-box;
      transform-origin: 10% 10%;
      animation: ribbonWaveRight 3.1s ease-in-out 0.5s infinite alternate;
    }

    @keyframes ribbonWaveLeft {
      0% { transform: rotate(-3deg) skewX(-2deg); }
      100% { transform: rotate(5deg) skewX(3deg); }
    }
    @keyframes ribbonWaveRight {
      0% { transform: rotate(3deg) skewX(2deg); }
      100% { transform: rotate(-5deg) skewX(-3deg); }
    }

    .svg-sparkle {
      transform-box: fill-box;
      transform-origin: center;
      animation: twinkleStar 2.2s ease-in-out infinite alternate;
    }
    .svg-sparkle.d1 { animation-delay: 0.4s; animation-duration: 2.1s; }
    .svg-sparkle.d2 { animation-delay: 1.1s; animation-duration: 2.6s; }
    .svg-sparkle.d3 { animation-delay: 1.7s; animation-duration: 2.3s; }
    .svg-sparkle.d4 { animation-delay: 0.8s; animation-duration: 2.5s; }

    @keyframes twinkleStar {
      0% { opacity: 0.2; transform: scale(0.55) rotate(0deg); }
      100% { opacity: 1; transform: scale(1.3) rotate(45deg); }
    }

    /* ==========================================
       3D GREETING CARD STAGE
       ========================================== */
    .card-stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 12;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      perspective: 2000px;
      transition: opacity 0.9s ease, visibility 0.9s ease;
    }

    .card-stage.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .card-backlight {
      position: absolute;
      width: min(560px, 95vw);
      height: min(650px, 90vh);
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(255, 245, 214, 0.88) 0%,
        rgba(255, 194, 212, 0.56) 46%,
        rgba(255, 182, 193, 0) 74%
      );
      filter: blur(22px);
      opacity: 0;
      transform: scale(0.7);
      transition: opacity 1.4s ease, transform 1.5s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    .card-stage.active .card-backlight {
      opacity: 1;
      transform: scale(1);
    }

    .card-stage.closing-vanish .card-backlight {
      opacity: 0;
      transform: scale(0.35);
      transition: opacity 1s ease, transform 1.1s cubic-bezier(0.55, 0.05, 0.67, 0.19);
    }

    .greeting-card-3d {
      position: relative;
      width: min(490px, 94vw);
      max-height: min(680px, 90dvh);
      transform-style: preserve-3d;
      transform: translateY(38px) scale(0.84) rotateX(10deg);
      opacity: 0;
      transition:
        transform 1.45s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 1.1s ease;
    }

    .card-stage.card-entered .greeting-card-3d {
      transform: translateY(0) scale(1) rotateX(0deg);
      opacity: 1;
    }

    .card-stage.closing-vanish .greeting-card-3d {
      transform: translateY(-12px) scale(0.24) rotateX(16deg);
      opacity: 0;
      filter: brightness(1.4) blur(4px);
      transition:
        transform 1.15s cubic-bezier(0.55, 0.06, 0.68, 0.19),
        opacity 1.05s ease,
        filter 1.05s ease;
    }

    /* Slow, graceful 3D Cover Flip (2.8 seconds) */
    .card-front-cover {
      position: absolute;
      inset: 0;
      border-radius: 22px;
      transform-style: preserve-3d;
      transform-origin: left center;
      transform: rotateY(0deg);
      transition:
        transform 2.8s cubic-bezier(0.22, 0.61, 0.36, 1),
        opacity 0.7s ease 2.05s;
      z-index: 5;
      pointer-events: none;
      box-shadow: 0 22px 50px rgba(112, 14, 40, 0.26);
    }

    .card-stage.card-opened .card-front-cover {
      transform: rotateY(-158deg);
      opacity: 0;
    }

    .card-stage.card-closing .card-front-cover {
      transition:
        transform 1.65s cubic-bezier(0.4, 0, 0.2, 1),
        opacity 0.25s ease;
      transform: rotateY(0deg);
      opacity: 1;
    }

    .cover-face {
      position: absolute;
      inset: 0;
      border-radius: 22px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
    }

    .cover-outer {
      background:
        radial-gradient(circle at 50% 38%, #fffdf9 0%, #fff3eb 58%, #fde2d9 100%);
      border: 2px solid var(--gold-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px;
      box-shadow: inset 0 0 0 6px rgba(255, 255, 255, 0.65), inset 0 0 0 7.5px rgba(212, 175, 55, 0.45);
    }

    .cover-inner {
      background: linear-gradient(135deg, #fffaf4 0%, #fce8e1 100%);
      border: 2px solid var(--gold-primary);
      transform: rotateY(180deg);
    }

    .cover-emblem {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      border: 1.5px solid rgba(212, 175, 55, 0.7);
      background: radial-gradient(circle, #fffdf9 0%, #ffe8ee 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 25px rgba(201, 24, 74, 0.14), inset 0 0 12px rgba(212, 175, 55, 0.22);
      margin-bottom: 16px;
    }

    .cover-subtitle {
      font-family: var(--font-serif);
      font-size: 1.65rem;
      font-style: italic;
      font-weight: 600;
      color: var(--rose-deep);
      letter-spacing: 0.03em;
    }

    .card-inside {
      position: relative;
      width: 100%;
      max-height: min(680px, 88dvh);
      overflow-y: auto;
      scrollbar-width: none;
      background:
        radial-gradient(circle at 50% 20%, #fffefb 0%, #fffbf5 62%, #fdf3e7 100%);
      border-radius: 22px;
      border: 2px solid var(--gold-primary);
      padding: clamp(20px, 4.2vw, 30px) clamp(20px, 4.5vw, 32px) clamp(18px, 3.8vw, 24px);
      box-shadow:
        0 25px 60px rgba(120, 15, 42, 0.25),
        0 4px 18px rgba(212, 175, 55, 0.22),
        inset 0 0 0 6px rgba(255, 255, 255, 0.8),
        inset 0 0 0 7.5px rgba(212, 175, 55, 0.42);
      z-index: 2;
    }

    .card-inside::-webkit-scrollbar {
      display: none;
    }

    .card-edge-shimmer {
      position: absolute;
      inset: 6px;
      border-radius: 16px;
      border: 1px solid rgba(212, 175, 55, 0.48);
      pointer-events: none;
    }

    .corner-ornament {
      position: absolute;
      width: 52px;
      height: 52px;
      pointer-events: none;
      opacity: 0.88;
      z-index: 3;
    }
    .corner-ornament.tl { top: 10px; left: 10px; }
    .corner-ornament.tr { top: 10px; right: 10px; transform: scaleX(-1); }
    .corner-ornament.bl { bottom: 10px; left: 10px; transform: scaleY(-1); }
    .corner-ornament.br { bottom: 10px; right: 10px; transform: scale(-1, -1); }

    .card-content-wrap {
      position: relative;
      z-index: 4;
      text-align: center;
    }

    .card-badge {
      display: inline-block;
      font-family: var(--font-serif);
      font-size: 1.02rem;
      font-style: italic;
      font-weight: 600;
      color: var(--gold-dark);
      letter-spacing: 0.08em;
      padding-bottom: 4px;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.45);
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.85s ease, transform 0.85s ease;
    }

    .wish-body {
      display: flex;
      flex-direction: column;
      gap: 9px;
      text-align: center;
      margin-bottom: 8px;
    }

    .wish-paragraph {
      font-family: var(--font-sans);
      font-size: clamp(0.86rem, 2.35vw, 0.96rem);
      line-height: 1.56;
      font-weight: 400;
      color: var(--wine-text);
      opacity: 0;
      transform: translateY(18px);
      transition:
        opacity 0.85s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.85s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .wish-paragraph.greeting-lead {
      font-family: var(--font-serif);
      font-size: clamp(1.12rem, 3.2vw, 1.28rem);
      font-weight: 700;
      color: var(--rose-primary);
      margin-bottom: 2px;
    }

    .highlight-radiant {
      font-family: var(--font-serif);
      font-size: 1.18em;
      font-weight: 700;
      font-style: italic;
      color: var(--rose-primary);
      background: linear-gradient(120deg, #c9184a 0%, #e03160 55%, #b87d14 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      padding: 0 2px;
    }

    /* Right-aligned Signature _huutrung */
    .wish-signature {
      font-family: var(--font-serif);
      font-size: 1.12rem;
      font-style: italic;
      font-weight: 700;
      color: var(--rose-deep);
      text-align: right;
      margin-top: 4px;
      margin-bottom: 10px;
      padding-right: 10px;
      letter-spacing: 0.03em;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.9s ease, transform 0.9s ease;
    }

    .card-footer-action {
      margin-top: 2px;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.9s ease, transform 0.9s ease;
    }

    /* Staggered reveal for 6 paragraphs + signature + button */
    .card-stage.wish-visible .card-badge {
      opacity: 1;
      transform: translateY(0);
      transition-delay: 0.05s;
    }
    .card-stage.wish-visible .wish-paragraph:nth-child(1) {
      opacity: 1;
      transform: translateY(0);
      transition-delay: 0.2s;
    }
    .card-stage.wish-visible .wish-paragraph:nth-child(2) {
      opacity: 1;
      transform: translateY(0);
      transition-delay: 0.45s;
    }
    .card-stage.wish-visible .wish-paragraph:nth-child(3) {
      opacity: 1;
      transform: translateY(0);
      transition-delay: 0.7s;
    }
    .card-stage.wish-visible .wish-paragraph:nth-child(4) {
      opacity: 1;
      transform: translateY(0);
      transition-delay: 0.95s;
    }
    .card-stage.wish-visible .wish-paragraph:nth-child(5) {
      opacity: 1;
      transform: translateY(0);
      transition-delay: 1.2s;
    }
    .card-stage.wish-visible .wish-paragraph:nth-child(6) {
      opacity: 1;
      transform: translateY(0);
      transition-delay: 1.45s;
    }
    .card-stage.wish-visible .wish-signature {
      opacity: 1;
      transform: translateY(0);
      transition-delay: 1.7s;
    }
    .card-stage.wish-visible .card-footer-action {
      opacity: 1;
      transform: translateY(0);
      transition-delay: 1.9s;
    }

    .card-stage.wish-hiding .card-badge,
    .card-stage.wish-hiding .wish-paragraph,
    .card-stage.wish-hiding .wish-signature,
    .card-stage.wish-hiding .card-footer-action {
      opacity: 0 !important;
      transform: translateY(10px) !important;
      transition: opacity 0.5s ease, transform 0.5s ease !important;
      transition-delay: 0s !important;
    }

    .btn-close-card {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 22px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(255, 244, 246, 0.96) 0%, rgba(255, 228, 235, 0.96) 100%);
      border: 1px solid rgba(212, 175, 55, 0.65);
      color: var(--rose-deep);
      font-family: var(--font-sans);
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(158, 20, 53, 0.12);
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .btn-close-card:hover {
      background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 100%);
      border-color: var(--rose-primary);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(201, 24, 74, 0.22);
    }

    .btn-close-card:active {
      transform: translateY(0);
    }

    .card-sparkles {
      position: absolute;
      inset: -14px;
      pointer-events: none;
      z-index: 6;
    }

    .edge-glint {
      position: absolute;
      width: 14px;
      height: 14px;
      background: radial-gradient(circle, #fffdf0 0%, #f5d77f 45%, transparent 72%);
      border-radius: 50%;
      animation: glintPulse 2.2s ease-in-out infinite alternate;
    }
    .edge-glint::before,
    .edge-glint::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      background: rgba(255, 248, 215, 0.9);
      transform: translate(-50%, -50%);
    }
    .edge-glint::before { width: 18px; height: 1.5px; }
    .edge-glint::after { width: 1.5px; height: 18px; }

    @keyframes glintPulse {
      0% { opacity: 0.2; transform: scale(0.5) rotate(0deg); }
      100% { opacity: 0.95; transform: scale(1.18) rotate(25deg); }
    }

    /* Particles & Floating Hearts */
    .ambient-sparkle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, #ffe6a3 55%, rgba(255, 182, 193, 0) 100%);
      box-shadow: 0 0 10px rgba(255, 230, 150, 0.85);
      pointer-events: none;
      will-change: transform, opacity;
      animation: floatSparkle var(--dur, 6s) ease-in-out var(--delay, 0s) infinite alternate;
    }

    @keyframes floatSparkle {
      0% {
        opacity: 0.15;
        transform: translate3d(0, 0, 0) scale(0.6);
      }
      50% {
        opacity: 0.95;
        transform: translate3d(var(--dx, 18px), var(--dy, -28px), 0) scale(1.2);
      }
      100% {
        opacity: 0.2;
        transform: translate3d(calc(var(--dx, 18px) * -0.7), calc(var(--dy, -28px) * 1.6), 0) scale(0.75);
      }
    }

    .rose-petal {
      position: absolute;
      pointer-events: none;
      will-change: transform, opacity;
      filter: drop-shadow(0 4px 8px rgba(140, 18, 48, 0.18));
    }

    .rose-petal.ambient-drift {
      animation: ambientPetalDrift var(--dur, 10s) linear var(--delay, 0s) infinite;
    }

    @keyframes ambientPetalDrift {
      0% {
        opacity: 0;
        transform: translate3d(var(--sx, 0px), -10vh, 0) rotate(0deg) scale(var(--sc, 1));
      }
      12% {
        opacity: var(--max-op, 0.85);
      }
      88% {
        opacity: var(--max-op, 0.85);
      }
      100% {
        opacity: 0;
        transform: translate3d(var(--ex, 90px), 108vh, 0) rotate(var(--rot, 320deg)) scale(var(--sc, 1));
      }
    }

    .floating-heart {
      position: absolute;
      pointer-events: none;
      will-change: transform, opacity;
      opacity: 0;
      animation: heartRiseCurve var(--dur, 6.5s) cubic-bezier(0.25, 0.46, 0.45, 0.94) var(--delay, 0s) infinite;
    }

    @keyframes heartRiseCurve {
      0% {
        opacity: 0;
        transform: translate3d(0, 20px, 0) scale(0.35) rotate(var(--r0, -8deg));
      }
      18% {
        opacity: var(--op, 0.88);
        transform: translate3d(var(--cx1, -18px), -65px, 0) scale(var(--sc, 1)) rotate(var(--r1, 8deg));
      }
      55% {
        opacity: var(--op, 0.88);
        transform: translate3d(var(--cx2, 24px), -210px, 0) scale(calc(var(--sc, 1) * 1.08)) rotate(var(--r2, -10deg));
      }
      85% {
        opacity: calc(var(--op, 0.88) * 0.45);
        transform: translate3d(var(--cx3, -14px), -340px, 0) scale(calc(var(--sc, 1) * 0.92)) rotate(var(--r3, 12deg));
      }
      100% {
        opacity: 0;
        transform: translate3d(var(--cx4, 18px), -430px, 0) scale(calc(var(--sc, 1) * 0.72)) rotate(var(--r4, 0deg));
      }
    }

    .pointer-sparkle {
      position: fixed;
      pointer-events: none;
      z-index: 30;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, #ffe599 50%, rgba(255, 117, 143, 0) 100%);
      box-shadow: 0 0 8px rgba(255, 225, 140, 0.9);
      will-change: transform, opacity;
    }

    @media (max-width: 480px) {
      .stage-container {
        padding: 14px;
      }
      .btn-top-right-back {
        top: 12px;
        right: 12px;
        padding: 7.5px 14px;
        font-size: 0.8rem;
      }
      .bouquet-stage {
        width: min(370px, 92vw);
        height: min(410px, 58vh);
      }
      .password-panel {
        padding: 20px 18px 20px;
        border-radius: 20px;
      }
      .card-inside {
        padding: 18px 16px 16px;
      }
      .wish-body {
        gap: 7.5px;
      }
      .corner-ornament {
        width: 40px;
        height: 40px;
      }
    }
  </style>
</head>
<body>

  <main class="scene" id="sceneRoot">
    <!-- Top-Right Back Button -->
    <button type="button" class="btn-top-right-back" id="topRightBackBtn" aria-label="Quay lại">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
        <path d="M3 3v5h5" />
      </svg>
      <span id="backBtnLabel">Quay lại thiệp</span>
    </button>

    <div class="ambient-aura" aria-hidden="true"></div>
    <div class="layer-fx" id="bgParticlesLayer" aria-hidden="true"></div>
    <div class="layer-fx" id="heartsLayer" aria-hidden="true"></div>

    <div class="stage-container">
      <!-- 1. Lock Screen (Bouquet is hidden here) -->
      <div class="lock-screen-box" id="lockScreenBox">
        <div class="lock-emblem" aria-hidden="true">🌷</div>
        <header class="intro-header" id="introHeader">
          <h1 class="intro-title">Một món quà nhỏ dành cho cậu 🌷</h1>
        </header>

        <section class="password-panel" id="passwordPanel" aria-label="Mở khóa món quà">
          <p class="password-guide">Nhập mật khẩu để mở món quà bí mật nhé.</p>
          <div class="input-group" id="inputGroup">
            <input
              type="password"
              id="passwordInput"
              class="password-input"
              placeholder="Nhập mật khẩu..."
              maxlength="12"
              inputmode="numeric"
              autocomplete="off"
              aria-label="Mật khẩu mở quà"
            />
            <button type="button" id="openGiftBtn" class="btn-open-gift">
              Mở món quà ✨
            </button>
          </div>
          <p class="error-msg" id="errorMsg" role="status" aria-live="polite">
            Hình như chưa đúng rồi, thử lại nhé!
          </p>
        </section>
      </div>

      <!-- 2. Realistic Multi-Layered Botanical Rose Bouquet (Appears in Finale with rich animations) -->
      <div class="bouquet-stage" id="bouquetStage" role="img" aria-label="Bó hoa hồng rực rỡ" title="Chạm vào bó hoa để bung thêm tim và cánh hoa nhé!">
        <!-- Rotating sunbeams & pulsing rings behind the bouquet -->
        <div class="bouquet-WaitGlow" aria-hidden="true">
          <div class="sunbeam-halo"></div>
          <div class="pulse-ring"></div>
          <div class="pulse-ring r2"></div>
        </div>

        <div class="bouquet-float-layer">
          <div class="bouquet-sway-wrapper">
            <svg class="bouquet-svg" viewBox="0 0 540 580" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <filter id="petalShadow" x="-15%" y="-15%" width="130%" height="135%">
                  <feDropShadow dx="0" dy="5" stdDeviation="4.5" flood-color="#4a0417" flood-opacity="0.28" />
                </filter>
                <filter id="softWrapShadow" x="-10%" y="-10%" width="120%" height="125%">
                  <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#590920" flood-opacity="0.2" />
                </filter>

                <linearGradient id="wrapBackSheet" x1="110" y1="120" x2="430" y2="510" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#fff8f9" />
                  <stop offset="52%" stop-color="#ffe0e8" />
                  <stop offset="100%" stop-color="#f2b8c9" />
                </linearGradient>
                <linearGradient id="wrapTissue" x1="150" y1="130" x2="390" y2="360" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
                  <stop offset="100%" stop-color="#ffeef3" stop-opacity="0.82" />
                </linearGradient>
                <linearGradient id="wrapFrontLeft" x1="85" y1="220" x2="285" y2="520" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#fffdfb" />
                  <stop offset="55%" stop-color="#ffecf1" />
                  <stop offset="100%" stop-color="#f5c6d5" />
                </linearGradient>
                <linearGradient id="wrapFrontRight" x1="455" y1="220" x2="255" y2="520" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#fffaf7" />
                  <stop offset="50%" stop-color="#ffe3ec" />
                  <stop offset="100%" stop-color="#ebb4c6" />
                </linearGradient>
                <linearGradient id="wrapInnerLining" x1="170" y1="160" x2="370" y2="380" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#ffc2d1" />
                  <stop offset="100%" stop-color="#d96b89" />
                </linearGradient>
                <linearGradient id="goldEdge" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#faecc4" />
                  <stop offset="50%" stop-color="#d4af37" />
                  <stop offset="100%" stop-color="#9c7818" />
                </linearGradient>

                <linearGradient id="satinRed" x1="180" y1="380" x2="360" y2="490" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#ec3868" />
                  <stop offset="48%" stop-color="#c9184a" />
                  <stop offset="100%" stop-color="#7d0929" />
                </linearGradient>
                <linearGradient id="satinShadow" x1="210" y1="400" x2="330" y2="480" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#9e0e35" />
                  <stop offset="100%" stop-color="#59041b" />
                </linearGradient>

                <linearGradient id="roseLeafDark" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#356e4d" />
                  <stop offset="100%" stop-color="#193b27" />
                </linearGradient>
                <linearGradient id="roseLeafMid" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#5ca37a" />
                  <stop offset="55%" stop-color="#387552" />
                  <stop offset="100%" stop-color="#204a32" />
                </linearGradient>
                <linearGradient id="eucalyptusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#84bda2" />
                  <stop offset="100%" stop-color="#487d65" />
                </linearGradient>

                <linearGradient id="crimsonGuard" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#eb2f5d" />
                  <stop offset="55%" stop-color="#b80f3c" />
                  <stop offset="100%" stop-color="#61041c" />
                </linearGradient>
                <linearGradient id="crimsonCupLeft" x1="0%" y1="20%" x2="90%" y2="90%">
                  <stop offset="0%" stop-color="#ff6b8e" />
                  <stop offset="45%" stop-color="#d41747" />
                  <stop offset="100%" stop-color="#750624" />
                </linearGradient>
                <linearGradient id="crimsonCupRight" x1="100%" y1="15%" x2="10%" y2="90%">
                  <stop offset="0%" stop-color="#ff547d" />
                  <stop offset="50%" stop-color="#c2103f" />
                  <stop offset="100%" stop-color="#5e031b" />
                </linearGradient>
                <radialGradient id="crimsonCore" cx="48%" cy="42%" r="55%">
                  <stop offset="0%" stop-color="#ff85a1" />
                  <stop offset="40%" stop-color="#c91444" />
                  <stop offset="100%" stop-color="#470214" />
                </radialGradient>

                <linearGradient id="blushGuard" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#fff0f5" />
                  <stop offset="58%" stop-color="#ff9ebb" />
                  <stop offset="100%" stop-color="#c94f75" />
                </linearGradient>
                <linearGradient id="blushCupLeft" x1="10%" y1="10%" x2="90%" y2="90%">
                  <stop offset="0%" stop-color="#ffffff" />
                  <stop offset="50%" stop-color="#ffb3c8" />
                  <stop offset="100%" stop-color="#bf3f67" />
                </linearGradient>
                <linearGradient id="blushCupRight" x1="90%" y1="10%" x2="10%" y2="90%">
                  <stop offset="0%" stop-color="#fff5f8" />
                  <stop offset="48%" stop-color="#ff9ebb" />
                  <stop offset="100%" stop-color="#a83257" />
                </linearGradient>
                <radialGradient id="blushCore" cx="50%" cy="42%" r="54%">
                  <stop offset="0%" stop-color="#fff7f9" />
                  <stop offset="45%" stop-color="#ff8da9" />
                  <stop offset="100%" stop-color="#962246" />
                </radialGradient>

                <linearGradient id="peachGuard" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#fff6f0" />
                  <stop offset="55%" stop-color="#ffaa94" />
                  <stop offset="100%" stop-color="#cf5346" />
                </linearGradient>
                <linearGradient id="peachCup" x1="15%" y1="10%" x2="85%" y2="90%">
                  <stop offset="0%" stop-color="#fffbf7" />
                  <stop offset="48%" stop-color="#ffb8a3" />
                  <stop offset="100%" stop-color="#bd4337" />
                </linearGradient>
                <radialGradient id="peachCore" cx="48%" cy="40%" r="55%">
                  <stop offset="0%" stop-color="#ffe5d9" />
                  <stop offset="48%" stop-color="#f27a66" />
                  <stop offset="100%" stop-color="#9c2a21" />
                </radialGradient>

                <linearGradient id="creamGuard" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#ffffff" />
                  <stop offset="65%" stop-color="#fff3e6" />
                  <stop offset="100%" stop-color="#dfc3a9" />
                </linearGradient>
                <radialGradient id="creamCore" cx="50%" cy="44%" r="52%">
                  <stop offset="0%" stop-color="#fffdf9" />
                  <stop offset="52%" stop-color="#fde4c8" />
                  <stop offset="100%" stop-color="#c99e78" />
                </radialGradient>

  <script>
    (function () {

      let currentState = 'LOCKED'; // LOCKED | OPENING | OPEN | CLOSING | FINALE
      let isAnimating = false;
      let audioCtx = null;
      let melodyInterval = null;
      let finalePetalTimer = null;

      // New heartfelt message automatically split into well-paced lines
      const WISH_PARAGRAPHS = [
        '<span class="greeting-lead">Chúc cậu 20/10 vui vẻ nhaaa 💗🌷</span>',
        'Tớ mong cậu lúc nào cũng vui vẻ, hạnh phúc, luôn được yêu thương và gặp thật nhiều điều tốt đẹp. Cảm ơn cậu vì đã xuất hiện trong cuộc sống của tớ, khiến những ngày bình thường của tớ trở nên đặc biệt hơn.',
        'Tớ mong rằng không chỉ hôm nay mà cả những ngày sau này, cậu đều có thể cười thật nhiều, buồn thật ít và luôn có tớ ở bên cạnh chia sẻ mọi điều.',
        'Tớ không giỏi nói những lời ngọt ngào nhưng tớ thật lòng mong cậu sẽ luôn cảm nhận được tình cảm mà tớ dành cho cậu.',
        'Tớ sori cậu vì đã làm cậu bùnn, tớ hứa tớ sẽ làm được những gì cậu mong chờ ở tớ ạa.',
        'Chúc <span class="highlight-radiant">bé iu của tớ</span> có một ngày 20/10 thật hạnh phúc nhaaa, yêu cậu nhiều lắmm💗'
      ];

      const PETAL_COLORS = [
        { fill: '#d91e53', highlight: '#ff7597' },
        { fill: '#ff758f', highlight: '#ffc2d1' },
        { fill: '#ffb3c1', highlight: '#fff0f3' },
        { fill: '#e05368', highlight: '#ff9ebb' },
        { fill: '#ff9b85', highlight: '#ffe5d9' }
      ];

      const HEART_STYLES = [
        { fill: '#d91e53', stroke: 'none', opacity: 0.88 },
        { fill: '#ff8fa3', stroke: 'none', opacity: 0.85 },
        { fill: '#ffb3c1', stroke: '#fff0f3', opacity: 0.82 },
        { fill: 'rgba(255, 143, 163, 0.5)', stroke: 'rgba(255, 220, 230, 0.9)', opacity: 0.9 },
        { fill: '#ff758f', stroke: 'none', opacity: 0.84 }
      ];

      function updateBackButtonUI() {
        if (currentState === 'LOCKED') {
          topRightBackBtn.classList.remove('visible');
        } else if (currentState === 'FINALE') {
          backBtnLabel.textContent = 'Quay lại thiệp 💌';
          topRightBackBtn.classList.add('visible');
        } else if (currentState === 'OPEN') {
          backBtnLabel.textContent = 'Về ban đầu ↺';
          topRightBackBtn.classList.add('visible');
        }
      }

      // Gentle built-in Web Audio API Piano Music Box
      function startRomanticMusicBox() {
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          if (!audioCtx) audioCtx = new AudioContextClass();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          if (melodyInterval) return;

          const notes = [
            523.25, 659.25, 783.99, 1046.50, 783.99, 659.25,
            587.33, 698.46, 880.00, 1174.66, 880.00, 698.46,
            659.25, 783.99, 987.77, 1318.51, 987.77, 783.99,
            523.25, 659.25, 783.99, 1046.50, 783.99, 523.25
          ];
          let idx = 0;

          function playSingleNote(freq) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);

            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.exponentialRampToValueAtTime(0.04, now + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.5);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 1.55);
          }

          playSingleNote(notes[idx++]);
          melodyInterval = setInterval(() => {
            playSingleNote(notes[idx % notes.length]);
            idx++;
          }, 540);
        } catch (err) {}
      }

      function createPetalSVG(size, colorObj) {
        const wrapper = document.createElement('div');
        wrapper.className = 'rose-petal';
        wrapper.style.width = `${size}px`;
        wrapper.style.height = `${size}px`;
        wrapper.innerHTML = `
          <svg viewBox="0 0 40 40" width="100%" height="100%" fill="none">
            <path d="M20 3 C31 3, 37 14, 34 25 C31 34, 22 38, 15 35 C7 31, 4 21, 8 12 C11 6, 15 3, 20 3 Z" fill="${colorObj.fill}" />
            <path d="M18 7 C25 8, 29 15, 26 23" stroke="${colorObj.highlight}" stroke-width="1.5" stroke-linecap="round" opacity="0.65" />
          </svg>
        `;
        return wrapper;
      }

      function initAmbientScene() {
        const sparkleCount = 28;
        for (let i = 0; i < sparkleCount; i++) {
          const sp = document.createElement('div');
          sp.className = 'ambient-sparkle';
          const size = (Math.random() * 5 + 3.5).toFixed(1);
          sp.style.width = `${size}px`;
          sp.style.height = `${size}px`;
          sp.style.left = `${(Math.random() * 92 + 4).toFixed(1)}%`;
          sp.style.top = `${(Math.random() * 88 + 6).toFixed(1)}%`;
          sp.style.setProperty('--dur', `${(Math.random() * 3.5 + 4).toFixed(1)}s`);
          sp.style.setProperty('--delay', `${(Math.random() * -6).toFixed(1)}s`);
          sp.style.setProperty('--dx', `${(Math.random() * 44 - 22).toFixed(0)}px`);
          sp.style.setProperty('--dy', `${(Math.random() * -40 - 12).toFixed(0)}px`);
          bgParticlesLayer.appendChild(sp);
        }

        const ambientPetals = 16;
        for (let i = 0; i < ambientPetals; i++) {
          spawnAmbientPetal(i, ambientPetals);
        }
      }

      function spawnAmbientPetal(index, total) {
        const size = Math.random() * 14 + 14;
        const color = PETAL_COLORS[index % PETAL_COLORS.length];
        const petal = createPetalSVG(size, color);
        petal.classList.add('ambient-drift');
        const startLeft = (index / total) * 94 + (Math.random() * 6);
        petal.style.left = `${startLeft.toFixed(1)}%`;
        petal.style.top = `-8%`;
        petal.style.setProperty('--dur', `${(Math.random() * 6 + 9).toFixed(1)}s`);
        petal.style.setProperty('--delay', `${(Math.random() * -14).toFixed(1)}s`);
        petal.style.setProperty('--sx', `${(Math.random() * 40 - 20).toFixed(0)}px`);
        petal.style.setProperty('--ex', `${(Math.random() * 160 - 80).toFixed(0)}px`);
        petal.style.setProperty('--rot', `${(Math.random() * 360 + 180).toFixed(0)}deg`);
        petal.style.setProperty('--sc', (Math.random() * 0.35 + 0.75).toFixed(2));
        petal.style.setProperty('--max-op', (Math.random() * 0.35 + 0.5).toFixed(2));
        bgParticlesLayer.appendChild(petal);
      }

      function triggerInwardSwirlBurst() {
        const count = 24;
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;

        for (let i = 0; i < count; i++) {
          const isSparkle = i % 3 === 0;
          const el = isSparkle
            ? document.createElement('div')
            : createPetalSVG(Math.random() * 16 + 15, PETAL_COLORS[i % PETAL_COLORS.length]);

          if (isSparkle) {
            el.className = 'ambient-sparkle';
            const sSize = Math.random() * 7 + 5;
            el.style.width = `${sSize}px`;
            el.style.height = `${sSize}px`;
          }

          const angle = (i / count) * Math.PI * 2 + (Math.random() * 0.3);
          const radius = Math.max(window.innerWidth, window.innerHeight) * (0.45 + Math.random() * 0.25);
          const startX = centerX + Math.cos(angle) * radius;
          const startY = centerY + Math.sin(angle) * radius;
          const targetX = centerX + (Math.random() * 140 - 70);
          const targetY = centerY + (Math.random() * 140 - 70);

          el.style.left = '0px';
          el.style.top = '0px';
          fgPetalsLayer.appendChild(el);

          const anim = el.animate([
            {
              transform: `translate3d(${startX}px, ${startY}px, 0) rotate(0deg) scale(0.6)`,
              opacity: 0
            },
            {
              transform: `translate3d(${(startX + targetX) * 0.5 + (Math.random() * 60 - 30)}px, ${(startY + targetY) * 0.5}px, 0) rotate(180deg) scale(1.1)`,
              opacity: 0.95,
              offset: 0.5
            },
            {
              transform: `translate3d(${targetX}px, ${targetY}px, 0) rotate(360deg) scale(0.3)`,
              opacity: 0
            }
          ], {
            duration: 1450 + Math.random() * 450,
            easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
            fill: 'forwards'
          });

          anim.onfinish = () => el.remove();
        }
      }

      function triggerCardOpenPetals() {
        const totalPetals = 32;
        const vw = window.innerWidth;
        const vh = window.innerHeight;

        for (let i = 0; i < totalPetals; i++) {
          const size = Math.random() * 16 + 13;
          const color = PETAL_COLORS[i % PETAL_COLORS.length];
          const petal = createPetalSVG(size, color);
          petal.style.left = '0px';
          petal.style.top = '0px';
          fgPetalsLayer.appendChild(petal);

          const fromBottom = i % 2 === 0;
          let startX, startY, midX, midY, endX, endY;

          if (fromBottom) {
            startX = Math.random() * vw;
            startY = vh + 30;
            midX = startX + (Math.random() * 160 - 80);
            midY = vh * (0.45 + Math.random() * 0.2);
            endX = midX + (Math.random() * 180 - 90);
            endY = -40;
          } else {
            const fromLeft = Math.random() > 0.5;
            startX = fromLeft ? -30 : vw + 30;
            startY = Math.random() * (vh * 0.75) + vh * 0.1;
            midX = vw * 0.5 + (Math.random() * 160 - 80);
            midY = startY - (Math.random() * 90 - 30);
            endX = fromLeft ? vw + 40 : -40;
            endY = midY + (Math.random() * 140 - 70);
          }

          const rotStart = Math.random() * 90 - 45;
          const rotEnd = rotStart + (Math.random() * 320 - 160);
          const maxOp = (Math.random() * 0.35 + 0.45).toFixed(2);

          const anim = petal.animate([
            {
              transform: `translate3d(${startX}px, ${startY}px, 0) rotate(${rotStart}deg) scale(0.7)`,
              opacity: 0
            },
            {
              transform: `translate3d(${midX}px, ${midY}px, 0) rotate(${(rotStart + rotEnd) * 0.5}deg) scale(1)`,
              opacity: maxOp,
              offset: 0.45
            },
            {
              transform: `translate3d(${endX}px, ${endY}px, 0) rotate(${rotEnd}deg) scale(0.8)`,
              opacity: 0
            }
          ], {
            duration: 3800 + Math.random() * 2400,
            delay: Math.random() * 900,
            easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)',
            fill: 'forwards'
          });

          anim.onfinish = () => petal.remove();
        }
      }

      function triggerCardVanishSwirl() {
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2;

        for (let i = 0; i < 36; i++) {
          const sp = document.createElement('div');
          sp.className = 'ambient-sparkle';
          const sz = Math.random() * 7 + 4;
          sp.style.width = `${sz}px`;
          sp.style.height = `${sz}px`;
          sp.style.left = '0px';
          sp.style.top = '0px';
          if (i % 2 === 0) {
            sp.style.background = 'radial-gradient(circle, #ffffff 0%, #ffb3c6 55%, transparent 100%)';
            sp.style.boxShadow = '0 0 12px rgba(255, 117, 143, 0.9)';
          }
          fgPetalsLayer.appendChild(sp);

          const angle = (i / 36) * Math.PI * 2 + Math.random() * 0.4;
          const dist1 = 40 + Math.random() * 70;
          const dist2 = 130 + Math.random() * 150;

          const anim = sp.animate([
            {
              transform: `translate3d(${cx + (Math.random() * 60 - 30)}px, ${cy + (Math.random() * 60 - 30)}px, 0) scale(0.4)`,
              opacity: 1
            },
            {
              transform: `translate3d(${cx + Math.cos(angle) * dist1}px, ${cy + Math.sin(angle) * dist1}px, 0) scale(1.3)`,
              opacity: 0.95,
              offset: 0.45
            },
            {
              transform: `translate3d(${cx + Math.cos(angle + 0.8) * dist2}px, ${cy + Math.sin(angle + 0.8) * dist2 - 40}px, 0) scale(0.1)`,
              opacity: 0
            }
          ], {
            duration: 1450 + Math.random() * 600,
            easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
            fill: 'forwards'
          });
          anim.onfinish = () => sp.remove();
        }

        for (let i = 0; i < 22; i++) {
          const size = Math.random() * 15 + 14;
          const petal = createPetalSVG(size, PETAL_COLORS[i % PETAL_COLORS.length]);
          petal.style.left = '0px';
          petal.style.top = '0px';
          fgPetalsLayer.appendChild(petal);

          const baseAngle = (i / 22) * Math.PI * 2;
          const rStart = 20 + Math.random() * 35;
          const rMid = 85 + Math.random() * 65;
          const rEnd = 170 + Math.random() * 110;

          const x0 = cx + Math.cos(baseAngle) * rStart;
          const y0 = cy + Math.sin(baseAngle) * rStart;
          const x1 = cx + Math.cos(baseAngle + 1.1) * rMid;
          const y1 = cy + Math.sin(baseAngle + 1.1) * rMid;
          const x2 = cx + Math.cos(baseAngle + 2.2) * rEnd;
          const y2 = cy + Math.sin(baseAngle + 2.2) * rEnd;

          const anim = petal.animate([
            {
              transform: `translate3d(${x0}px, ${y0}px, 0) rotate(0deg) scale(0.5)`,
              opacity: 0
            },
            {
              transform: `translate3d(${x1}px, ${y1}px, 0) rotate(160deg) scale(1.08)`,
              opacity: 0.9,
              offset: 0.45
            },
            {
              transform: `translate3d(${x2}px, ${y2}px, 0) rotate(340deg) scale(0.65)`,
              opacity: 0
            }
          ], {
            duration: 1700 + Math.random() * 650,
            delay: Math.random() * 220,
            easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
            fill: 'forwards'
          });
          anim.onfinish = () => petal.remove();
        }
      }

      // Continuous Romantic Hearts & Breeze Petals in Finale
      function startContinuousFinaleEffects() {
        heartsLayer.innerHTML = '';
        const totalHearts = 28;

        for (let i = 0; i < totalHearts; i++) {
          const hWrap = document.createElement('div');
          hWrap.className = 'floating-heart';

          const isSmallInner = i % 3 === 0;
          const size = isSmallInner
            ? Math.random() * 12 + 13
            : Math.random() * 19 + 20;

          const styleObj = HEART_STYLES[i % HEART_STYLES.length];
          hWrap.style.width = `${size.toFixed(1)}px`;
          hWrap.style.height = `${size.toFixed(1)}px`;

          const spreadX = isSmallInner
            ? (Math.random() * 34 - 17)
            : (Math.random() * 72 - 36);
          const startTop = 52 + (Math.random() * 22 - 10);

          hWrap.style.left = `calc(50% + ${spreadX.toFixed(1)}vw)`;
          hWrap.style.top = `${startTop.toFixed(1)}%`;

          const driftDirection = spreadX >= 0 ? 1 : -1;
          const sideDrift = isSmallInner ? (Math.random() * 28 - 14) : (driftDirection * (Math.random() * 50 + 16));

          hWrap.style.setProperty('--dur', `${(Math.random() * 3.8 + 5.2).toFixed(2)}s`);
          hWrap.style.setProperty('--delay', `${(Math.random() * -5.5).toFixed(2)}s`);
          hWrap.style.setProperty('--op', styleObj.opacity);
          hWrap.style.setProperty('--sc', (Math.random() * 0.28 + 0.85).toFixed(2));

          hWrap.style.setProperty('--cx1', `${(sideDrift * 0.4 + (Math.random() * 20 - 10)).toFixed(0)}px`);
          hWrap.style.setProperty('--cx2', `${(sideDrift * 0.85 + (Math.random() * 30 - 15)).toFixed(0)}px`);
          hWrap.style.setProperty('--cx3', `${(sideDrift * 1.15 + (Math.random() * 26 - 13)).toFixed(0)}px`);
          hWrap.style.setProperty('--cx4', `${(sideDrift * 1.4).toFixed(0)}px`);

          hWrap.style.setProperty('--r0', `${(Math.random() * 20 - 10).toFixed(0)}deg`);
          hWrap.style.setProperty('--r1', `${(Math.random() * 28 - 14).toFixed(0)}deg`);
          hWrap.style.setProperty('--r2', `${(Math.random() * 32 - 16).toFixed(0)}deg`);
          hWrap.style.setProperty('--r3', `${(Math.random() * 28 - 14).toFixed(0)}deg`);
          hWrap.style.setProperty('--r4', `${(Math.random() * 24 - 12).toFixed(0)}deg`);

          hWrap.innerHTML = `
            <svg viewBox="0 0 32 32" width="100%" height="100%" fill="none">
              <path
                d="M16 27.5 C16 27.5 3.5 19.2 3.5 10.8 C3.5 6.4 6.9 3.2 11 3.2 C13.5 3.2 15.2 4.5 16 6.2 C16.8 4.5 18.5 3.2 21 3.2 C25.1 3.2 28.5 6.4 28.5 10.8 C28.5 19.2 16 27.5 16 27.5 Z"
                fill="${styleObj.fill}"
                stroke="${styleObj.stroke}"
                stroke-width="1.2"
              />
              <path
                d="M7.5 10.2 C7.5 8.2 9.1 6.6 11.1 6.6"
                stroke="rgba(255, 255, 255, 0.55)"
                stroke-width="1.4"
                stroke-linecap="round"
              />
            </svg>
          `;

          heartsLayer.appendChild(hWrap);
        }

        if (finalePetalTimer) clearInterval(finalePetalTimer);
        finalePetalTimer = setInterval(() => {
          if (currentState !== 'FINALE') return;
          spawnSingleFinaleBreezePetal();
        }, 550);
      }

      function stopContinuousFinaleEffects() {
        heartsLayer.innerHTML = '';
        if (finalePetalTimer) {
          clearInterval(finalePetalTimer);
          finalePetalTimer = null;
        }
      }

      function spawnSingleFinaleBreezePetal() {
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const size = Math.random() * 15 + 13;
        const color = PETAL_COLORS[Math.floor(Math.random() * PETAL_COLORS.length)];
        const petal = createPetalSVG(size, color);
        petal.style.left = '0px';
        petal.style.top = '0px';
        fgPetalsLayer.appendChild(petal);

        const startX = vw * 0.5 + (Math.random() * 260 - 130);
        const startY = vh * 0.45 + (Math.random() * 120 - 60);
        const midX = startX + (Math.random() * 180 - 90);
        const midY = startY - (Math.random() * 120 + 40);
        const endX = midX + (Math.random() * 220 - 110);
        const endY = startY + (Math.random() * 180 - 40);

        const anim = petal.animate([
          { transform: `translate3d(${startX}px, ${startY}px, 0) rotate(0deg) scale(0.4)`, opacity: 0 },
          { transform: `translate3d(${midX}px, ${midY}px, 0) rotate(140deg) scale(1.05)`, opacity: 0.85, offset: 0.45 },
          { transform: `translate3d(${endX}px, ${endY}px, 0) rotate(310deg) scale(0.7)`, opacity: 0 }
        ], {
          duration: 3400 + Math.random() * 1400,
          easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)',
          fill: 'forwards'
        });
        anim.onfinish = () => petal.remove();
      }

      function triggerBouquetTapBurst(clientX, clientY) {
        const cx = clientX || window.innerWidth / 2;
        const cy = clientY || window.innerHeight / 2;

        for (let i = 0; i < 14; i++) {
          const isHeart = i % 2 === 0;
          const el = isHeart
            ? document.createElement('div')
            : createPetalSVG(Math.random() * 14 + 13, PETAL_COLORS[i % PETAL_COLORS.length]);

          if (isHeart) {
            const st = HEART_STYLES[i % HEART_STYLES.length];
            const sz = Math.random() * 14 + 14;
            el.style.position = 'absolute';
            el.style.width = `${sz}px`;
            el.style.height = `${sz}px`;
            el.style.pointerEvents = 'none';
            el.innerHTML = `
              <svg viewBox="0 0 32 32" width="100%" height="100%" fill="none">
                <path d="M16 27.5 C16 27.5 3.5 19.2 3.5 10.8 C3.5 6.4 6.9 3.2 11 3.2 C13.5 3.2 15.2 4.5 16 6.2 C16.8 4.5 18.5 3.2 21 3.2 C25.1 3.2 28.5 6.4 28.5 10.8 C28.5 19.2 16 27.5 16 27.5 Z" fill="${st.fill}"/>
              </svg>
            `;
          }

          el.style.left = '0px';
          el.style.top = '0px';
          fgPetalsLayer.appendChild(el);

          const angle = (i / 14) * Math.PI * 2 + (Math.random() * 0.4);
          const dist = 70 + Math.random() * 110;
          const tx = cx + Math.cos(angle) * dist;
          const ty = cy + Math.sin(angle) * dist - 50;

          const anim = el.animate([
            { transform: `translate3d(${cx}px, ${cy}px, 0) scale(0.3) rotate(0deg)`, opacity: 1 },
            { transform: `translate3d(${tx}px, ${ty}px, 0) scale(1.1) rotate(${(Math.random() * 120 - 60).toFixed(0)}deg)`, opacity: 0.9, offset: 0.55 },
            { transform: `translate3d(${tx + (Math.random() * 40 - 20)}px, ${ty - 60}px, 0) scale(0.5) rotate(${(Math.random() * 240 - 120).toFixed(0)}deg)`, opacity: 0 }
          ], {
            duration: 1400 + Math.random() * 500,
            easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
            fill: 'forwards'
          });
          anim.onfinish = () => el.remove();
        }
      }

      function injectWishContent() {
        wishContainer.innerHTML = WISH_PARAGRAPHS
          .map(text => `<p class="wish-paragraph">${text}</p>`)
          .join('');
      }

      // 1. Unlock & Open Card Sequence
      function handleUnlockAttempt() {
        if (isAnimating || currentState !== 'LOCKED') return;

        const val = passwordInput.value.trim();
        if (val !== PASSCODE) {
          errorMsg.classList.add('visible');
          inputGroup.classList.remove('shake-anim');
          void inputGroup.offsetWidth;
          inputGroup.classList.add('shake-anim');
          passwordInput.select();
          return;
        }

        isAnimating = true;
        currentState = 'OPENING';
        errorMsg.classList.remove('visible');
        passwordInput.blur();

        startRomanticMusicBox();
        injectWishContent();
        sceneRoot.classList.add('state-card-open');
        triggerInwardSwirlBurst();

        setTimeout(() => {
          cardStage.setAttribute('aria-hidden', 'false');
          cardStage.classList.add('active', 'card-entered');
        }, 480);

        setTimeout(() => {
          cardStage.classList.add('card-opened');
        }, 1250);

        setTimeout(() => {
          cardStage.classList.add('wish-visible');
          triggerCardOpenPetals();
          currentState = 'OPEN';
          isAnimating = false;
          updateBackButtonUI();
        }, 3150);
      }

      // 2. Fold Card -> Reveal Realistic Blooming Rose Bouquet & Continuous Hearts
      function handleCloseCard() {
        if (isAnimating || currentState !== 'OPEN') return;

        isAnimating = true;
        currentState = 'CLOSING';
        topRightBackBtn.classList.remove('visible');

        cardStage.classList.add('wish-hiding');

        setTimeout(() => {
          cardStage.classList.remove('card-opened', 'wish-visible');
          cardStage.classList.add('card-closing');
        }, 450);

        setTimeout(() => {
          cardStage.classList.add('closing-vanish');
          triggerCardVanishSwirl();
        }, 1750);

        setTimeout(() => {
          sceneRoot.classList.remove('state-card-open');
          sceneRoot.classList.add('state-finale', 'state-FinaleGlow');
          startContinuousFinaleEffects();
        }, 2050);

        setTimeout(() => {
          cardStage.classList.remove('active', 'card-entered', 'card-closing', 'closing-vanish', 'wish-hiding');
          cardStage.setAttribute('aria-hidden', 'true');
          wishContainer.innerHTML = '';
          currentState = 'FINALE';
          isAnimating = false;
          updateBackButtonUI();
        }, 3100);
      }

      // 3. Top-Right Back Button Handler
      function handleTopRightBack() {
        if (isAnimating) return;

        // If in FINALE (viewing bouquet): return to the closed card & flip it open again
        if (currentState === 'FINALE') {
          isAnimating = true;
          currentState = 'OPENING';
          topRightBackBtn.classList.remove('visible');

          stopContinuousFinaleEffects();
          sceneRoot.classList.remove('state-finale', 'state-FinaleGlow');
          sceneRoot.classList.add('state-card-open');

          injectWishContent();
          triggerInwardSwirlBurst();

          setTimeout(() => {
            cardStage.setAttribute('aria-hidden', 'false');
            cardStage.classList.add('active', 'card-entered');
          }, 350);

          setTimeout(() => {
            cardStage.classList.add('card-opened');
          }, 1100);

          setTimeout(() => {
            cardStage.classList.add('wish-visible');
            triggerCardOpenPetals();
            currentState = 'OPEN';
            isAnimating = false;
            updateBackButtonUI();
          }, 2950);
          return;
        }

        // If in OPEN (reading card): fold card and return to the initial Lock Screen
        if (currentState === 'OPEN') {
          isAnimating = true;
          topRightBackBtn.classList.remove('visible');
          cardStage.classList.add('wish-hiding');

          setTimeout(() => {
            cardStage.classList.remove('card-opened', 'wish-visible');
            cardStage.classList.add('card-closing');
          }, 400);

          setTimeout(() => {
            cardStage.classList.remove('active', 'card-entered', 'card-closing', 'wish-hiding');
            cardStage.setAttribute('aria-hidden', 'true');
            sceneRoot.classList.remove('state-card-open', 'state-finale', 'state-FinaleGlow');
            wishContainer.innerHTML = '';
            passwordInput.value = '';
            currentState = 'LOCKED';
            isAnimating = false;
            updateBackButtonUI();
          }, 1650);
        }
      }

      // Subtle fairy-dust sparkle trail on touch / pointer move
      let lastSparkleTime = 0;
      window.addEventListener('pointermove', function (e) {
        const now = performance.now();
        if (now - lastSparkleTime < 45) return;
        lastSparkleTime = now;

        const dot = document.createElement('div');
        dot.className = 'pointer-sparkle';
        const size = Math.random() * 5 + 3.5;
        dot.style.width = `${size}px`;
        dot.style.height = `${size}px`;
        dot.style.left = `${e.clientX}px`;
        dot.style.top = `${e.clientY}px`;
        document.body.appendChild(dot);

        const dx = (Math.random() - 0.5) * 26;
        const dy = (Math.random() - 0.5) * 26 - 10;
        const anim = dot.animate([
          { transform: 'translate(-50%, -50%) scale(1)', opacity: 0.9 },
          { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0.1)`, opacity: 0 }
        ], {
          duration: 650,
          easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
          fill: 'forwards'
        });
        anim.onfinish = () => dot.remove();
      }, { passive: true });

      openGiftBtn.addEventListener('click', handleUnlockAttempt);

      passwordInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          handleUnlockAttempt();
        } else if (errorMsg.classList.contains('visible')) {
          errorMsg.classList.remove('visible');
        }
      });

      closeCardBtn.addEventListener('click', handleCloseCard);
      topRightBackBtn.addEventListener('click', handleTopRightBack);

      bouquetStage.addEventListener('click', function (e) {
        if (currentState === 'FINALE') {
          triggerBouquetTapBurst(e.clientX, e.clientY);
        }
      });

      initAmbientScene();
    })();
  </script>
</body>
</html>
